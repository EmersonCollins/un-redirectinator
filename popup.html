<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Un-Redirectinator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="toggle-protection" class="toggle-button" type="button" aria-pressed="false">
      <i class="bi bi-tools" aria-hidden="true"></i>
      <span id="toggle-label">Is Inactive</span>
    </button>
    <p id="site-hint" class="hint"></p>
    <section class="whitelist-section">
      <h2>Whitelisted Sites</h2>
      <div class="whitelist-form">
        <input id="whitelist-input" type="text" placeholder="example.com or https://example.com" />
        <button id="whitelist-add" type="button">Add</button>
      </div>
      <ul id="whitelist-list" class="whitelist-list"></ul>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
